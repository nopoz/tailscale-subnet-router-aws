# Gitleaks configuration.
#
# Kept here rather than at the repository root because .gitignore excludes every
# dotfile by wildcard, and .github/ already carries a negation.
#
# GitHub's own secret scanning is enabled here and covers provider tokens, an AWS
# key or a Tailscale key, better than this can: it also tells the provider to
# revoke them. What it does not cover on a repository like this one is the
# generic tier, private keys and connection strings and unbranded API keys.
# Scanning for those is a paid feature limited to organization-owned
# repositories, so on a personal repository the default rules below are the only
# thing looking for them, not a duplicate of something already running.

[extend]
useDefault = true

# This stack's tailnet name is the operator's email address. It is configuration
# rather than a credential, so no scanner recognises it on sight and GitHub will
# never flag it, yet committing it is the one disclosure this repository actually
# risks. Hence a blanket rule: no email addresses in tracked files at all. It is
# broader than the real target on purpose, because encoding the address here to
# match it exactly would publish the very thing being protected.
[[rules]]
id = "email-address"
description = "Email address in a tracked file. The tailnet name is one; keep it in .env."
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'''
tags = ["privacy", "tailnet"]

  [rules.allowlist]
  regexTarget = "match"
  regexes = [
    # Reserved for documentation by RFC 2606, so it can never be anyone's.
    '''@example\.(com|org|net)''',
  ]
